<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0070f3"/></marker><marker id="grayarrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c8c8c"/></marker></defs>
<rect width="1500" height="900" fill="#fff"/>
<text x="64" y="68" font-family="Noto Sans CJK TC, sans-serif" font-size="36" fill="#171717">具身智能嵌入式软件框架</text>
<text x="66" y="101" font-family="Noto Sans CJK TC, monospace" font-size="16" fill="#666">PROPOSED ARCHITECTURE · C11 PORTABLE CORE · 2026-11-11</text>
<text x="1430" y="68" text-anchor="end" font-family="Noto Sans CJK TC, sans-serif" font-size="16" fill="#ab570a">方案图｜需目标硬件验证</text>
<!-- AI plane -->
<rect x="64" y="145" width="1372" height="176" rx="12" fill="#fafafa" stroke="#d9d9d9" stroke-width="1.5"/>
<text x="90" y="181" font-family="Noto Sans CJK TC, sans-serif" font-size="22" fill="#171717">非实时智能平面（Linux 用户态）</text>
<text x="90" y="207" font-family="Noto Sans CJK TC, monospace" font-size="15" fill="#666">AI / planning / perception · 可以升级和重启，不直接持有执行器</text>
<g font-family="Noto Sans CJK TC, sans-serif" font-size="18" fill="#171717">
<rect x="90" y="232" width="250" height="62" rx="7" fill="#fff" stroke="#a1a1a1"/><text x="215" y="258" text-anchor="middle">感知与模型推理</text><text x="215" y="281" text-anchor="middle" font-family="Noto Sans CJK TC, monospace" font-size="14" fill="#666">camera / lidar / policy</text>
<rect x="392" y="232" width="250" height="62" rx="7" fill="#fff" stroke="#a1a1a1"/><text x="517" y="258" text-anchor="middle">任务规划器</text><text x="517" y="281" text-anchor="middle" font-family="Noto Sans CJK TC, monospace" font-size="14" fill="#666">goal → trajectory</text>
<rect x="694" y="232" width="250" height="62" rx="7" fill="#d3e5ff" stroke="#0070f3"/><text x="819" y="258" text-anchor="middle">命令发布器</text><text x="819" y="281" text-anchor="middle" font-family="Noto Sans CJK TC, monospace" font-size="14" fill="#174a8b">seq + deadline + limits</text>
<rect x="996" y="232" width="350" height="62" rx="7" fill="#fff" stroke="#a1a1a1"/><text x="1171" y="258" text-anchor="middle">诊断、日志与 OTA 管理</text><text x="1171" y="281" text-anchor="middle" font-family="Noto Sans CJK TC, monospace" font-size="14" fill="#666">health / metrics / rollback</text>
</g>
<!-- arrows AI -->
<path d="M340 263 H388" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M642 263 H690" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<!-- deterministic -->
<rect x="64" y="365" width="1372" height="250" rx="12" fill="#f5f5f5" stroke="#a1a1a1" stroke-width="1.5"/>
<text x="90" y="402" font-family="Noto Sans CJK TC, sans-serif" font-size="22" fill="#171717">确定性实时控制平面（同一份核心代码）</text>
<text x="90" y="428" font-family="Noto Sans CJK TC, monospace" font-size="15" fill="#666">固定周期 · 单一所有者 · 无动态分配 · 任何故障都使输出进入安全状态</text>
<g font-family="Noto Sans CJK TC, sans-serif" font-size="18" fill="#171717">
<rect x="90" y="462" width="220" height="92" rx="7" fill="#fff" stroke="#a1a1a1"/><text x="200" y="493" text-anchor="middle">输入采样</text><text x="200" y="519" text-anchor="middle" font-size="15" fill="#666">传感器快照</text><text x="200" y="541" text-anchor="middle" font-family="Noto Sans CJK TC, monospace" font-size="13" fill="#666">timestamp / validity</text>
<rect x="354" y="462" width="250" height="92" rx="7" fill="#fff" stroke="#a1a1a1"/><text x="479" y="493" text-anchor="middle">命令与状态校验</text><text x="479" y="519" text-anchor="middle" font-size="15" fill="#666">序号、时限、范围</text><text x="479" y="541" text-anchor="middle" font-family="Noto Sans CJK TC, monospace" font-size="13" fill="#666">watchdog / fault latch</text>
<rect x="648" y="462" width="250" height="92" rx="7" fill="#d3e5ff" stroke="#0070f3"/><text x="773" y="493" text-anchor="middle">受限控制器</text><text x="773" y="519" text-anchor="middle" font-size="15" fill="#174a8b">位置 / 速度 / 电流限制</text><text x="773" y="541" text-anchor="middle" font-family="Noto Sans CJK TC, monospace" font-size="13" fill="#174a8b">deterministic step()</text>
<rect x="942" y="462" width="220" height="92" rx="7" fill="#fff" stroke="#a1a1a1"/><text x="1052" y="493" text-anchor="middle">输出仲裁</text><text x="1052" y="519" text-anchor="middle" font-size="15" fill="#666">安全门控</text><text x="1052" y="541" text-anchor="middle" font-family="Noto Sans CJK TC, monospace" font-size="13" fill="#666">disable on fault</text>
<rect x="1206" y="462" width="200" height="92" rx="7" fill="#fff" stroke="#a1a1a1"/><text x="1306" y="493" text-anchor="middle">执行器输出</text><text x="1306" y="519" text-anchor="middle" font-size="15" fill="#666">双关节基线</text><text x="1306" y="541" text-anchor="middle" font-family="Noto Sans CJK TC, monospace" font-size="13" fill="#666">actuator_write()</text>
</g>
<path d="M310 508 H350" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M604 508 H644" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M898 508 H938" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1162 508 H1202" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<!-- adapters -->
<rect x="64" y="660" width="1372" height="145" rx="12" fill="#fafafa" stroke="#d9d9d9" stroke-width="1.5"/>
<text x="90" y="697" font-family="Noto Sans CJK TC, sans-serif" font-size="22" fill="#171717">平台适配层与硬件边界</text>
<rect x="90" y="720" width="290" height="58" rx="7" fill="#fff" stroke="#a1a1a1"/><text x="235" y="745" text-anchor="middle" font-family="Noto Sans CJK TC, sans-serif" font-size="18">Linux 适配器</text><text x="235" y="766" text-anchor="middle" font-family="Noto Sans CJK TC, monospace" font-size="13" fill="#666">clock · thread · socket · driver</text>
<rect x="432" y="720" width="290" height="58" rx="7" fill="#fff" stroke="#a1a1a1"/><text x="577" y="745" text-anchor="middle" font-family="Noto Sans CJK TC, sans-serif" font-size="18">FreeRTOS / RT-Thread 适配器</text><text x="577" y="766" text-anchor="middle" font-family="Noto Sans CJK TC, monospace" font-size="13" fill="#666">tick · task · queue · ISR handoff</text>
<rect x="774" y="720" width="290" height="58" rx="7" fill="#fff" stroke="#a1a1a1"/><text x="919" y="745" text-anchor="middle" font-family="Noto Sans CJK TC, sans-serif" font-size="18">BSP / HAL</text><text x="919" y="766" text-anchor="middle" font-family="Noto Sans CJK TC, monospace" font-size="13" fill="#666">ADC · encoder · PWM · CAN</text>
<rect x="1116" y="720" width="290" height="58" rx="7" fill="#fff" stroke="#c50000"/><text x="1261" y="745" text-anchor="middle" font-family="Noto Sans CJK TC, sans-serif" font-size="18" fill="#c50000">独立急停链路</text><text x="1261" y="766" text-anchor="middle" font-family="Noto Sans CJK TC, monospace" font-size="13" fill="#c50000">硬件断能 / 安全继电器</text>
<path d="M819 321 V365" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M200 615 V716" stroke="#8c8c8c" stroke-width="1.8" fill="none" marker-end="url(#grayarrow)"/><path d="M479 615 V716" stroke="#8c8c8c" stroke-width="1.8" fill="none" marker-end="url(#grayarrow)"/><path d="M773 615 V716" stroke="#8c8c8c" stroke-width="1.8" fill="none" marker-end="url(#grayarrow)"/><path d="M1052 615 V716" stroke="#8c8c8c" stroke-width="1.8" fill="none" marker-end="url(#grayarrow)"/>
<text x="90" y="850" font-family="Noto Sans CJK TC, sans-serif" font-size="16" fill="#666">主流向：AI 命令 → 校验 → 受限控制 → 安全输出。实线为逻辑流；灰色箭头为平台依赖边界；红框表示必须独立于软件闭环。</text>
</svg>
