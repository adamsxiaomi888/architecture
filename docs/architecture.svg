<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1160" viewBox="0 0 1500 1160"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#0070f3"/></marker></defs><rect width="1500" height="1160" fill="white"/><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#171717}.small{font-size:18px;fill:#666}.title{font-size:34px;font-weight:700}.head{font-size:23px;font-weight:600}.body{font-size:20px}.mono{font-family:monospace;font-size:18px;fill:#4d4d4d}</style>
<text x="48" y="60" class="title">通用嵌入式平台 · 当前代码架构</text>
<text x="48" y="94" class="small">2026-11-12 ｜ 实线区域：已实现原型；虚线区域：接口草案 / 待实现。不是量产完成图。</text>
<rect x="48" y="125" width="860" height="655" rx="12" fill="#fafafa" stroke="#ebebeb"/>
<rect x="940" y="125" width="512" height="655" rx="12" fill="#fafafa" stroke="#ebebeb"/>
<text x="70" y="164" class="head">Windows / Linux 浏览器：本地执行 WASM</text>
<text x="962" y="164" class="head">Linux 原生进程：独立运行场景</text>
<rect x="72" y="190" width="812" height="120" rx="8" fill="#fff" stroke="#b8b8b8" stroke-width="1.3"/>
<text x="94" y="225" class="head">网页控制与观察  ·  web/app.js</text>
<text x="94" y="258" class="body">目标命令 / 启停 / 故障注入 / JSONL 导出与回放</text>
<text x="94" y="287" class="body">3D 外形示意 + 曲线：同一份状态；不是实物物理模型</text>
<path d="M475 310 L475 356" fill="none" stroke="#0070f3" stroke-width="2" marker-end="url(#arrow)"/>
<text x="490" y="339" class="small">er_web_* 调用 / JSON 观测</text>
<rect x="72" y="358" width="812" height="95" rx="8" fill="#fff" stroke="#b8b8b8" stroke-width="1.3"/>
<text x="94" y="393" class="head">WASM 桥接  ·  web/wasm/bridge.c</text>
<text x="94" y="426" class="body">组织虚拟周期、提交命令、返回位置 / 速度 / 故障</text>
<path d="M475 453 L475 498" fill="none" stroke="#0070f3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="72" y="500" width="390" height="166" rx="8" fill="#edf5ff" stroke="#b8b8b8" stroke-width="1.3"/>
<text x="94" y="535" class="head">C 控制核心  ·  runtime.c</text>
<text x="94" y="568" class="body">双轴比例速度计算</text>
<text x="94" y="597" class="body">命令 / 时间 / 传感器校验</text>
<text x="94" y="626" class="body">故障锁存与输出禁用</text>
<rect x="494" y="500" width="390" height="166" rx="8" fill="#edf5ff" stroke="#b8b8b8" stroke-width="1.3"/>
<text x="516" y="535" class="head">虚拟舵机  ·  sim.c</text>
<text x="516" y="568" class="body">固定虚拟时间步进</text>
<text x="516" y="597" class="body">速度积分更新位置</text>
<text x="516" y="626" class="body">传感器失效 / 卡死注入</text>
<path d="M462 539 L494 539" fill="none" stroke="#0070f3" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M494 631 L462 631" fill="none" stroke="#0070f3" stroke-width="2" marker-end="url(#arrow)"/>
<text x="95" y="706" class="body">输出 → 虚拟运动 → 传感器反馈 → 下一次控制计算</text>
<text x="95" y="746" class="small">WASM 未加载时明确显示 JS 演示后备；不混用两种回放日志。</text>
<rect x="964" y="190" width="464" height="120" rx="8" fill="#fff" stroke="#b8b8b8" stroke-width="1.3"/>
<text x="986" y="225" class="head">场景运行器  ·  sim/runner.c</text>
<text x="986" y="258" class="body">normal / stale / sensor / stall</text>
<text x="986" y="287" class="body">300 个虚拟时间步；输出 JSONL</text>
<path d="M1195 310 L1195 358" fill="none" stroke="#0070f3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="964" y="358" width="464" height="135" rx="8" fill="#edf5ff" stroke="#b8b8b8" stroke-width="1.3"/>
<text x="986" y="393" class="head">原生编译同一份 C 源码</text>
<text x="986" y="426" class="body">runtime.c + sim.c</text>
<text x="986" y="455" class="body">与浏览器共享源码，不共享进程状态</text>
<path d="M1195 493 L1195 540" fill="none" stroke="#0070f3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="964" y="542" width="464" height="124" rx="8" fill="#fff" stroke="#b8b8b8" stroke-width="1.3"/>
<text x="986" y="577" class="head">回归验证</text>
<text x="986" y="610" class="body">CTest / WASM 桥接与网页适配测试</text>
<text x="986" y="639" class="body">tools/replay.py：固定场景逐条比较</text>
<text x="965" y="706" class="small">没有 Linux ↔ MCU 通信进程。</text>
<text x="965" y="739" class="small">当前也未接 AI 模型或真实舵机。</text>
<rect x="48" y="812" width="440" height="188" rx="8" fill="#fafafa" stroke="#b8b8b8" stroke-width="1.3"/>
<text x="70" y="847" class="head">独立原型：OTA</text>
<text x="70" y="880" class="body">src/ota.c 是内存状态机</text>
<text x="70" y="909" class="body">未接 Flash / Bootloader / 持久化</text>
<text x="70" y="938" class="body">签名通过外部回调；不是完整 OTA</text>
<rect x="520" y="812" width="440" height="188" rx="8" fill="#fff" stroke="#b8b8b8" stroke-width="1.3" stroke-dasharray="7 5"/>
<text x="542" y="847" class="head">接口草案：HAL</text>
<text x="542" y="880" class="body">include/er/hal.h 定义设备契约</text>
<text x="542" y="909" class="body">时钟 / 传感器 / 执行器 / 存储</text>
<text x="542" y="938" class="body">尚未作为控制核心的驱动接入层</text>
<rect x="992" y="812" width="460" height="188" rx="8" fill="#fff" stroke="#b8b8b8" stroke-width="1.3" stroke-dasharray="7 5"/>
<text x="1014" y="847" class="head">目标部署：Linux + MCU</text>
<text x="1014" y="880" class="body">OSAL / RTOS / BSP / 总线驱动</text>
<text x="1014" y="909" class="body">参数、产测、日志、硬件安全链</text>
<text x="1014" y="938" class="body">需要实现与上板验收</text>
<text x="48" y="1050" class="head">读图边界</text>
<text x="48" y="1085" class="body">3D 当前是程序化外形展示；官方 STEP/STL 保存为参考。卡死模型已实现，但堵转保护尚未实现。</text>
<text x="48" y="1122" class="small">通过仿真只能证明对应软件用例；PWM/ADC 时序、真实掉电、机械安全仍需硬件验证。</text>
</svg>