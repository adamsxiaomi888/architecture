<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1520" viewBox="0 0 1800 1520"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#51647e"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Noto Sans CJK TC",sans-serif;fill:#19304b}.title{font-size:34px;font-weight:700}.head{font-size:25px;font-weight:700}.body{font-size:20px}.small{font-size:17px}.line{stroke:#51647e;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="1800" height="1520" fill="#edf2f7"/>
<text x="40" y="54" class="title">通用嵌入式平台 · Linux + MCU 量产架构基线</text>
<text x="40" y="87" class="small">设计约束，不是已通过量产验证的声明｜依赖边界与部署边界分开表达｜2026-11-12</text>
<rect x="40" y="115" width="1720" height="110" rx="12" fill="#fff" stroke="#abb9ca" stroke-width="2"/>
<text x="60" y="150" class="head">产品应用与配置：按能力组合，不复制平台</text>
<text x="60" y="183" class="body">智能家居 / 机器人 / 机器狗 / 美容设备 / 工业设备  →  产品状态机、设备清单、安全动作、资源预算</text>
<path class="line" d="M900 225 L900 250"/>
<rect x="40" y="250" width="1720" height="105" rx="12" fill="#dceaf8" stroke="#abb9ca" stroke-width="2"/>
<text x="60" y="285" class="head">可复用能力与契约：部署到选定执行域</text>
<text x="60" y="318" class="body">运动 / 温控 / 传感 / 电源｜能力位、单位、时间戳、错误码、阻塞规则、禁能语义｜不依赖具体芯片与 RTOS</text>
<path class="line" d="M460 355 L460 385"/>
<path class="line" d="M1290 355 L1290 385"/>
<rect x="40" y="385" width="790" height="370" rx="12" fill="#fff" stroke="#abb9ca" stroke-width="2"/>
<text x="60" y="420" class="head">Linux 系统服务域 · 非实时</text>
<text x="60" y="453" class="body">应用编排 / AI（可选）/ UI / 网络</text>
<text x="60" y="482" class="body">参数与标定管理 / 日志汇总 / 诊断 / 产测工具</text>
<text x="60" y="511" class="body">OTA 编排：包签名、兼容性、升级依赖、状态追踪</text>
<text x="60" y="540" class="body">Linux 应用与系统：试启动、健康确认、失败恢复</text>
<text x="60" y="569" class="body">OSAL / POSIX：时钟、同步、任务、平台 I/O</text>
<text x="60" y="598" class="body">设备接入：Linux 驱动 / SDK / 存储适配</text>
<rect x="970" y="385" width="790" height="370" rx="12" fill="#fff" stroke="#abb9ca" stroke-width="2"/>
<text x="990" y="420" class="head">MCU 实时执行域 · 单所有者控制</text>
<text x="990" y="453" class="body">传感器快照 → 校验 / 控制 / 故障状态机 → 输出</text>
<text x="990" y="482" class="body">有界周期预算；控制路径不分配、不阻塞、不写 Flash</text>
<text x="990" y="511" class="body">控制参数采用验证后的版本化快照</text>
<text x="990" y="540" class="body">服务任务：诊断、参数提交、升级接收（独立调度）</text>
<text x="990" y="569" class="body">OSAL：选定 RTOS / 裸机调度适配</text>
<text x="990" y="598" class="body">板级：时钟、DMA、中断、启动与资源配置</text>
<path class="line" d="M830 500 L970 500"/><path class="line" d="M970 665 L830 665"/>
<text x="842" y="478" class="small">命令 →</text>
<text x="842" y="699" class="small">状态 ←</text>
<rect x="40" y="785" width="1720" height="120" rx="12" fill="#e8e4fa" stroke="#abb9ca" stroke-width="2"/>
<text x="60" y="820" class="head">跨域通信契约 · CAN / UART / Ethernet 按板级选择</text>
<text x="60" y="853" class="body">版本 / 长度 / 序号 / 会话 / 截止时间 / 完整性校验；网络接入另需身份认证</text>
<text x="60" y="882" class="body">超时与重启握手、背压与有界队列；两端时钟映射明确；禁止直接传指针或共享任意内部状态</text>
<path class="line" d="M460 755 L460 785"/>
<path class="line" d="M1290 755 L1290 785"/>
<rect x="40" y="935" width="790" height="160" rx="12" fill="#fff" stroke="#abb9ca" stroke-width="2"/>
<text x="60" y="970" class="head">升级与持久化边界 · 两端分别适配</text>
<text x="60" y="1003" class="body">Linux A/B 或经验证的系统恢复方案</text>
<text x="60" y="1032" class="body">MCU Bootloader + 非活动槽 + 掉电安全元数据</text>
<text x="60" y="1061" class="body">安全态确认 → 切换 → 试启动 → 确认 / 回滚</text>
<text x="60" y="1090" class="body">外接舵机升级：仅设备协议支持时提供</text>
<rect x="970" y="935" width="790" height="160" rx="12" fill="#fff" stroke="#abb9ca" stroke-width="2"/>
<text x="990" y="970" class="head">设备接口 → 具体驱动 → 总线 HAL / BSP</text>
<text x="990" y="1003" class="body">执行器 / 传感器 / 存储 / 看门狗能力接口</text>
<text x="990" y="1032" class="body">HD-1910 TTL、PWM 舵机、CAN 电机、温控器</text>
<text x="990" y="1061" class="body">直接驱动电机：本地 PWM / ADC / 编码器同步</text>
<text x="990" y="1090" class="body">虚拟驱动与真实驱动遵守同一契约（接入待验证）</text>
<path class="line" d="M460 905 L460 935"/>
<path class="line" d="M1290 905 L1290 935"/>
<rect x="40" y="1125" width="1720" height="125" rx="12" fill="#fff0e7" stroke="#d2a085" stroke-width="2"/>
<text x="60" y="1160" class="head">独立硬件保护链 · 软件失效时仍须进入产品规定的安全状态</text>
<text x="60" y="1193" class="body">急停 / 功率级过流 / 独立看门狗 → 安全控制器或硬件门控 → 驱动器禁能 / 制动 / STO（具备时）</text>
<text x="60" y="1222" class="body">安全动作由机构风险决定；HD-1910 不预设具备 STO；断能、抱闸与保护响应须实测。</text>
<path class="line" d="M1360 1125 L1360 1095"/>
<rect x="40" y="1280" width="840" height="165" rx="12" fill="#fff" stroke="#abb9ca" stroke-width="2"/>
<text x="60" y="1315" class="head">替换边界与验收责任</text>
<text x="60" y="1348" class="body">换产品：应用 + 能力组合 + 安全策略</text>
<text x="60" y="1377" class="body">换 OS：OSAL + 启动 / 调度集成</text>
<text x="60" y="1406" class="body">换 MCU / 设备：BSP / 驱动 + 能力配置</text>
<text x="60" y="1435" class="body">每个适配端口重新验证时序、资源与故障行为</text>
<rect x="910" y="1280" width="850" height="165" rx="12" fill="#fff" stroke="#abb9ca" stroke-width="2"/>
<text x="930" y="1315" class="head">当前实现状态 · 与架构要求独立记录</text>
<text x="930" y="1348" class="body">已验证：Linux 原生 + WASM 共用 C 控制核心</text>
<text x="930" y="1377" class="body">已有：虚拟舵机、场景回放、网页 3D、HAL 草案</text>
<text x="930" y="1406" class="body">未完成：RTOS / BSP / 真实驱动 / 量产 OTA</text>
<text x="930" y="1435" class="body">发布门禁：HIL、掉电、保护时序、老化与产测</text>
<text x="40" y="1485" class="small">详细约束和状态以 docs/design.md、docs/status.md 与产品验收记录为准。箭头表示交互或依赖，不代表单一调用栈。</text>
</svg>